version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    reviewers:
      - clevervi
      - raishark
    open-pull-requests-limit: 10
    ignore:
      # `@types/node`'s major tracks the Node major it describes. CI runs
      # NODE_VERSION 24 (.github/workflows/ci.yml) and every workspace depends
      # on `^24`, so accepting a major bump would type the codebase against a
      # Node this project does not run: `tsc` would accept calls to APIs added
      # after 24 and they would fail at runtime, with every gate green.
      #
      # Refused once, on #168, which proposed 24.13.5 -> 26.6.1 with all eight
      # checks passing — because nothing in CI compares the types' major against
      # the runtime's.
      #
      # Measured rather than assumed, by unpacking both versions and diffing
      # their declarations: 26.6.1 declares 697 symbols that 24.13.5 does not,
      # across 17 more files, including `QuicEndpoint`, `QuicSession`,
      # `QuicStream` and `DynamicLibrary`. Those are not cosmetic — they are
      # `node:quic` and friends, absent from the runtime this repository runs.
      #
      # Minor and patch bumps still arrive. The major moves when the runtime
      # moves, in the same pull request, deliberately.
      #
      # This rule only stops the pull request being opened. The pairing itself
      # is checked by the "Node's major and its types agree" step in ci.yml,
      # which fails in both directions — including the one this rule cannot
      # cover, where NODE_VERSION moves and the types are left behind.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # **This is what stops a pinned sha becoming an unpatched dependency**, and it
  # is the half of #123 that is easy to forget. Every `uses:` in
  # `.github/workflows/` is a full 40-character commit sha with the version in a
  # trailing comment; Dependabot understands that form, bumps the sha and
  # rewrites the comment, so the pin moves deliberately instead of never.
  #
  # Why shas rather than tags, measured on 2026-09-21 rather than assumed:
  #
  #   github/codeql-action@v4   -> v4.38.1, with 47 patch tags behind it
  #   actions/checkout@v7       -> v7.0.1, while v7.0.0 exists
  #   pnpm/action-setup@v6      -> v6.0.10, while v6.1.0 exists
  #
  # A major tag is a pointer its owner moves. The last line is the other
  # direction of the same fact: `v6` is *behind* the newest v6 release, so the
  # tag was not even giving what it appeared to promise.
  #
  # And `actions/dependency-review-action@v5` was never a tag at all — no `v5`
  # tag exists in that repository, only a `v5` **branch**, which moves on every
  # push rather than on every release. It happened to sit on `v5.0.0`'s commit
  # when this was checked, held there by nothing.
  #
  # What this does not do: notice that an action's owner has been compromised
  # between bumps. Nothing here does. Pinning narrows the window to the moment a
  # bump is accepted, which is a review, rather than leaving it open at every
  # workflow run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    reviewers:
      - clevervi
      - raishark
    open-pull-requests-limit: 5
