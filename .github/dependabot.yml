version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    reviewers:
      - clevervi
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    reviewers:
      - clevervi
    open-pull-requests-limit: 5
