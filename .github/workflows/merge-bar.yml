# Turns "GitHub has to be configured like this" into "if GitHub stops being
# configured like this, CI goes red."
#
# The merge bar lives outside the repository. Branch protection and rulesets are
# edited in a web interface, without a commit, a diff or a review, and until now
# nothing compared them to what `CONTRIBUTING.md` and `.github/merge-bar.json`
# claim. That gap was found three times in a week and filed as #165.
#
# **It reads the ruleset, not classic branch protection**, and the reason is
# measured rather than preferred: a workflow-scoped token gets
# `403 Resource not accessible by integration` on
# `/branches/develop/protection`, because `administration` is not among the
# permissions a workflow may request. `/rules/branches/develop` needs none of
# that. Checking the classic rules would have meant storing a token with
# administrative read access — the first long-lived credential this repository
# holds — to verify a configuration that is already public.
#
# Scheduled as well as per-pull-request, because the drift this catches does not
# arrive with a commit. Nobody pushes when they change a setting in a browser.

name: Merge bar

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]
  schedule:
    # Daily. A setting changed in a browser is found within a day rather than
    # whenever somebody next opens a pull request.
    #
    # **And a failed scheduled run reports into a page nobody has open.** There
    # is no notification here and no other scheduled job whose failure anybody
    # has had to notice, so in practice the drift becomes visible on the next
    # pull request — which is the window where nobody is looking. Stated rather
    # than implied by the word `schedule`, because a daily check that nothing
    # reads is a daily check in name.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: The merge bar matches its contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history. `no-squash.mjs` walks from a baseline commit to
          # HEAD, and the default shallow clone cannot see the baseline — the
          # check would fail for the wrong reason, or, worse, be "fixed" by
          # loosening it until it passed.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The comparison first, with no network involved. A comparison that cannot
      # detect a difference would let the step below pass while checking
      # nothing, and that failure is silent in exactly the way this whole
      # workflow exists to prevent.
      - name: The comparison can tell a difference
        run: node --test scripts/merge-bar.test.mjs

      - name: What GitHub applies to develop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/merge-bar.mjs

      # The same shape as above: prove the comparison works, then run it.
      - name: The squash check can tell a squash from a rebase
        run: node --test scripts/no-squash.test.mjs

      # Not a check on a setting — a workflow token cannot read the merge
      # methods, measured in #192. This reads what landed. It catches a squash
      # after the fact rather than preventing one, which is late and still
      # better than the weeks #182 went unnoticed.
      #
      # **Not on a pull request**, and not as a convenience. On a `pull_request`
      # event GitHub checks out an ephemeral merge of the head into the base,
      # whose subject is `Merge <sha> into <sha>` and whose committer is GitHub —
      # which this check reads as a squash, correctly by its own rule and wrongly
      # about the world. Measured: it went red on the pull request that added it.
      #
      # Scoping it is the fix rather than teaching it about that subject, because
      # the question itself is wrong on a pull request. Nothing has landed yet.
      # A squash reaches `develop` through a merge, which is a push, and that is
      # where this runs — immediately, plus daily.
      - name: No squash merge has landed on develop
        if: github.event_name != 'pull_request'
        run: node scripts/no-squash.mjs

      - name: What reaches a log cannot fabricate a line in it
        run: node --test scripts/for-log.test.mjs

      - name: The duplication exclusions can tell excluded from absent
        run: node --test scripts/cpd-exclusions.test.mjs

      # #197: `sonar-project.properties` looked like configuration and was
      # ignored. `.sonarcloud.properties` replaced it and nothing checked that
      # the replacement kept working — the same failure one step along.
      #
      # **Not on a pull request**, for the reason the squash check is not. This
      # reads the project's analysis, which is `develop`'s, and compares it
      # against the properties file in the working tree. On a pull request that
      # edits that file the two disagree by construction until it merges, and a
      # check that is red for a reason it cannot be right about is worse than no
      # check.
      - name: The duplication exclusions are still in force
        if: github.event_name != 'pull_request'
        run: node scripts/cpd-exclusions.mjs
