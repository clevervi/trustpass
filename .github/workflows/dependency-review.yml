name: Dependency review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review added and updated dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # A dependency is code we did not write running with our privileges.
          # Anything moderate or worse blocks the pull request.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Copyleft licences are incompatible with how this project may later
          # be distributed; surface them at the point of introduction.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only
