# The one rule in the merge bar that permissions no longer enforce.
#
# `CONTRIBUTING.md` records one maintainer working from two accounts, and the
# review device in the workflow skill uses both as argumentative voices — the
# case under one, the objection under the other, with a disclosure saying they
# are the same person.
#
# Neither may ever approve. A GitHub approval is the artefact that means
# "somebody else checked", and nothing here can produce one honestly.
#
# That used to be impossible rather than forbidden: the second account held no
# write access, so it could comment and could not approve. It holds `write` now,
# which it does not need — commenting on a public repository needs no
# permission, measured — and which put the rule back to being a promise.
#
# This is the promise made mechanical again.
#
# **It deliberately does not block an approval from anybody else.** An outside
# reviewer approving would be real, and would be the best thing to happen to
# this repository. The refusal names the two accounts rather than the act.

name: No self-approval

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # An approval can arrive long after the pull request last changed, so the
  # push trigger alone would run before the thing it is checking for exists.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

jobs:
  no-self-approval:
    name: No approval from the maintainer's own accounts
    runs-on: ubuntu-latest

    steps:
      - name: Refuse an approval from an account the maintainer holds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Both spellings of each, because the API returns the login as the
          # account set it and a case mismatch here would silently pass.
          MAINTAINER_ACCOUNTS='["clevervi","Raishark","raishark","CleverVi"]'

          offending=$(
            gh api "repos/${REPOSITORY}/pulls/${NUMBER}/reviews" --paginate \
              --jq "[.[] | select(.state == \"APPROVED\") | .user.login] | unique
                    | map(select(. as \$login | ${MAINTAINER_ACCOUNTS} | index(\$login)))
                    | join(\", \")"
          )

          if [ -n "$offending" ]; then
            echo "::error::Approved by ${offending}, which is one of the maintainer's own accounts."
            echo ""
            echo "This repository has one maintainer working from two accounts, and"
            echo "CONTRIBUTING.md says so. An approval between them is a review signal"
            echo "with nothing behind it, and this is a public repository where somebody"
            echo "will read it as two engineers agreeing."
            echo ""
            echo "The two accounts argue instead: the case under one, the objection under"
            echo "the other, with the disclosure that they are the same person. Dismiss"
            echo "the approval and leave the argument."
            exit 1
          fi

          echo "No approval from an account the maintainer holds."
