# The one rule in the merge bar that permissions no longer enforce.
#
# An approval from this repository's own collaborator accounts is not evidence
# that anybody else checked the work, so it must not be able to open the merge
# gate. That used to be impossible rather than forbidden — the second account
# held no write access, so it could comment and could not approve. It holds
# `write` now, which it does not need for the review process (commenting on a
# public repository needs no permission, measured), and which turned the rule
# back into a promise.
#
# This is the promise made mechanical again.
#
# **It deliberately does not block an approval from anybody else.** An outside
# reviewer approving would be real, and would be the best thing to happen to
# this repository. The refusal names specific accounts rather than the act.
#
# **The list is the control. Do not narrow it to "the pull request's author".**
# That change looks like a tightening and is the opposite: it would let one
# listed account approve another's pull request while this check stayed green
# and kept the same name, so branch protection would still report the rule as
# satisfied. If the accounts ever stop needing to be listed here, remove the
# check rather than hollowing it out.

name: No self-approval

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # An approval can arrive long after the pull request last changed, so the
  # push trigger alone would run before the thing it is checking for exists.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

jobs:
  no-self-approval:
    name: No approval from the maintainer's own accounts
    runs-on: ubuntu-latest

    steps:
      - name: Refuse an approval from a listed account
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Both spellings of each, because the API returns the login as the
          # account set it and a case mismatch here would silently pass.
          BLOCKED_APPROVERS='["clevervi","Raishark","raishark","CleverVi"]'

          offending=$(
            gh api "repos/${REPOSITORY}/pulls/${NUMBER}/reviews" --paginate \
              --jq "[.[] | select(.state == \"APPROVED\") | .user.login] | unique
                    | map(select(. as \$login | ${BLOCKED_APPROVERS} | index(\$login)))
                    | join(\", \")"
          )

          if [ -n "$offending" ]; then
            echo "::error::Approved by ${offending}, whose approval does not satisfy this repository's merge bar."
            echo ""
            echo "An approval from a collaborator account on this repository is not"
            echo "evidence that an independent reviewer checked the change, and this is"
            echo "a public repository where it would be read as one."
            echo ""
            echo "Dismiss the approval and leave the argued review instead: the case for"
            echo "the design, the strongest objection to it, and the answer. See"
            echo "CONTRIBUTING.md."
            exit 1
          fi

          echo "No approval from a listed account."
