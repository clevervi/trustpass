name: Full secret scan

# The per-event scan in ci.yml only covers the commits in that push or pull
# request — around 262 bytes for a one-line change. That catches a key being
# introduced, and nothing about a key already sitting in history.
#
# This job sweeps every commit. It runs weekly rather than per-push because the
# cost grows with history while the value does not.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan every commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Required: gitleaks can only scan commits that were fetched.
          fetch-depth: 0

      - name: Scan the full history
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --exit-code 1

      # `latest` is deliberate here. A scanner pinned to an old tag stops
      # recognising credential formats published after that tag, which is the
      # opposite of what this job is for.
