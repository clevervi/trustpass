# Temporary. Answers one question and is deleted in this same pull request.
#
# #192 wants CI to check that this repository still refuses squash merges, the
# way `merge-bar.yml` already checks the ruleset. That is only possible if a
# workflow-scoped token can read the merge-method settings, and it is already
# established that such a token cannot read everything: it gets 403 on
# `/branches/develop/protection`, because `administration` is not a permission a
# workflow may request.
#
# Whether `allow_squash_merge` is subject to the same limit is not the same
# question — those fields come back from `GET /repos/{owner}/{repo}`, which
# needs only `metadata: read`, but GitHub filters them out for callers without
# push or admin. Unauthenticated, they are absent; measured.
#
# So: measure it rather than reason about it.
name: TP-196 merge method probe

on: push

permissions:
  contents: read

jobs:
  probe:
    name: Can a workflow token read the merge methods
    runs-on: ubuntu-latest
    steps:
      - name: Ask for the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== GET /repos/clevervi/trustpass =="
          if gh api repos/clevervi/trustpass > repo.json 2> err.txt; then
            echo "  request: ok"
          else
            echo "  request: FAILED"
            cat err.txt
            exit 0
          fi

          echo ""
          echo "== merge-method fields =="
          for key in allow_squash_merge allow_merge_commit allow_rebase_merge delete_branch_on_merge; do
            value=$(jq -r --arg k "$key" 'if has($k) then (.[$k] | tostring) else "ABSENT" end' repo.json)
            printf '  %-26s %s\n' "$key" "$value"
          done

          echo ""
          echo "== the endpoint already known to refuse =="
          if gh api repos/clevervi/trustpass/branches/develop/protection > /dev/null 2> prot.txt; then
            echo "  branch protection: readable"
          else
            echo "  branch protection: refused — $(head -c 120 prot.txt)"
          fi

          echo ""
          echo "VERDICT:"
          if jq -e 'has("allow_squash_merge")' repo.json > /dev/null; then
            echo "  a workflow token CAN read the merge methods; merge-bar.mjs can check them"
          else
            echo "  a workflow token CANNOT read them; checking from CI would need a stored"
            echo "  admin token, which is the trade #165 already refused"
          fi
