name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.33.2"

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Migrations in this repository are hand-written, because triggers,
      # deferred constraint triggers and partial indexes are not things
      # drizzle-kit can express. But drizzle-kit keeps its own snapshot of the
      # schema and refreshes it only when drizzle-kit generates a migration, so
      # a hand-written one leaves that snapshot describing a database that no
      # longer exists. It drifted silently from 0011 to 0016 and surfaced as a
      # generated migration that fails on every database (#85).
      #
      # A green result here means: the part of the schema drizzle-kit can
      # represent is not stale. It does NOT mean Postgres matches the schema.
      # Nine triggers and two deferrable constraints carry the guarantees in
      # 0005, 0008, 0010, 0014, 0015 and 0016, and no snapshot has ever
      # contained one of them. Those are covered by the integration suite
      # against a real Postgres, which is a different job for a reason.
      #
      # No DATABASE_URL, and that is the point. `generate` needs no database, so
      # drizzle.config.ts no longer demands a credential for it — the first
      # version of this step invented one and a secret scanner objected to the
      # credential-shaped string, correctly.
      - name: Migrations describe the schema drizzle-kit can see
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::drizzle-kit generated a migration, so the schema and the migrations disagree."
            echo "Either the change belongs in a migration that was never written, or a hand-written"
            echo "migration left the snapshot behind. See packages/db/drizzle/0017 and issue #85."
            git status --porcelain packages/db/drizzle
            git --no-pager diff -- packages/db/drizzle
            exit 1
          fi

  test:
    name: Test against Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trustpass
          POSTGRES_PASSWORD: trustpass_ci
          POSTGRES_DB: trustpass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustpass -d trustpass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://trustpass:trustpass_ci@localhost:5432/trustpass_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      # The runtime role is created NOLOGIN with no password, so it needs one
      # before the least-privilege suite can connect as it — and without that
      # connection the suite skips, which would be worse than not having it:
      # a green run claiming a guarantee nobody measured.
      #
      # Generated per run rather than stored. The database is a throwaway
      # container that lives for the length of this job, so there is nothing
      # here to rotate and nothing to leak beyond it. Masked anyway, because a
      # password in a public build log teaches the wrong habit.
      - name: Provision the runtime role
        run: |
          RUNTIME_PASSWORD="$(openssl rand -hex 24)"
          MIGRATION_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$RUNTIME_PASSWORD"
          echo "::add-mask::$MIGRATION_PASSWORD"
          TRUSTPASS_RUNTIME_PASSWORD="$RUNTIME_PASSWORD" \
          TRUSTPASS_MIGRATION_PASSWORD="$MIGRATION_PASSWORD" \
            pnpm db:provision
          echo "RUNTIME_DATABASE_URL=postgresql://trustpass_runtime:${RUNTIME_PASSWORD}@localhost:5432/trustpass_test" >> "$GITHUB_ENV"

      - name: Run test suites
        run: pnpm test

      # The privilege matrix, on the run page, for a reader who wants to see
      # what the application can do without checking out the branch. The test
      # suite is what *enforces* it; this is what makes it legible. Written to
      # the step summary rather than uploaded, so it needs no extra action —
      # #123 is about having fewer of those, not more.
      - name: Report the privilege matrix
        if: always()
        run: |
          {
            echo '## What `trustpass_runtime` can do'
            echo
            echo '```'
            PGPASSWORD=trustpass_ci psql -h localhost -U trustpass -d trustpass_test -P pager=off -c "
              SELECT c.relname AS table_name,
                     has_table_privilege('trustpass_runtime', c.oid, 'SELECT')   AS select,
                     has_table_privilege('trustpass_runtime', c.oid, 'INSERT')   AS insert,
                     has_table_privilege('trustpass_runtime', c.oid, 'UPDATE')   AS update,
                     has_table_privilege('trustpass_runtime', c.oid, 'DELETE')   AS delete,
                     has_table_privilege('trustpass_runtime', c.oid, 'TRUNCATE') AS truncate
              FROM pg_class c
              WHERE c.relnamespace = 'public'::regnamespace AND c.relkind = 'r'
              ORDER BY 1;"
            PGPASSWORD=trustpass_ci psql -h localhost -U trustpass -d trustpass_test -P pager=off -c "
              SELECT rolname, rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolbypassrls
              FROM pg_roles WHERE rolname LIKE 'trustpass%' ORDER BY 1;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
