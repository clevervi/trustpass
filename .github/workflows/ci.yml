name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.33.2"

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Migrations in this repository are hand-written, because triggers,
      # deferred constraint triggers and partial indexes are not things
      # drizzle-kit can express. But drizzle-kit keeps its own snapshot of the
      # schema and refreshes it only when drizzle-kit generates a migration, so
      # a hand-written one leaves that snapshot describing a database that no
      # longer exists. It drifted silently from 0011 to 0016 and surfaced as a
      # generated migration that fails on every database (#85).
      #
      # A green result here means: the part of the schema drizzle-kit can
      # represent is not stale. It does NOT mean Postgres matches the schema.
      # Nine triggers and two deferrable constraints carry the guarantees in
      # 0005, 0008, 0010, 0014, 0015 and 0016, and no snapshot has ever
      # contained one of them. Those are covered by the integration suite
      # against a real Postgres, which is a different job for a reason.
      #
      # No DATABASE_URL, and that is the point. `generate` needs no database, so
      # drizzle.config.ts no longer demands a credential for it — the first
      # version of this step invented one and a secret scanner objected to the
      # credential-shaped string, correctly.
      - name: Migrations describe the schema drizzle-kit can see
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::drizzle-kit generated a migration, so the schema and the migrations disagree."
            echo "Either the change belongs in a migration that was never written, or a hand-written"
            echo "migration left the snapshot behind. See packages/db/drizzle/0017 and issue #85."
            git status --porcelain packages/db/drizzle
            git --no-pager diff -- packages/db/drizzle
            exit 1
          fi

  test:
    name: Test against Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trustpass
          POSTGRES_PASSWORD: trustpass_ci
          POSTGRES_DB: trustpass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustpass -d trustpass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://trustpass:trustpass_ci@localhost:5432/trustpass_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run test suites
        run: pnpm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
