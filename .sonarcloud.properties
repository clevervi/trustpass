# The file SonarQube Cloud actually reads.
#
# `sonar-project.properties` sits beside this one and is ignored. That is not a
# guess: the vendor's documentation says "if you import a project that already
# contains a sonar-project.properties file, SonarQube Cloud will ignore the
# parameters in your sonar-project.properties file", and #197 measured it twice
# — `scripts/` is excluded there and has failed the gate from that directory
# twice.
#
# This file is read from the default branch, which is `develop`. A pull request
# therefore cannot configure its own analysis: whatever lands here applies to
# what comes next, not to the change that adds it.
#
# Wildcards are documented as unsupported here. `*.sql` below is the open
# question, and the point of landing this alone: four migrations are currently
# counted as duplicated — 0014 at 67.5%, 0016 at 37.7%, 0008 at 34.1% and 0009
# at 22.8% — so whether the pattern works is a before-and-after that can be read
# off rather than assumed.

# Forward-only migrations necessarily restate what they replace.
#
# Postgres has no ALTER FUNCTION for a body, so changing a trigger function means
# CREATE OR REPLACE with the whole thing. `CONTRIBUTING.md` forbids editing an
# applied migration, so the repetition cannot be removed without breaking a rule
# that matters more — and the scanner is measuring the migration strategy
# working.
#
# Excluded from duplication only. The files are still scanned for issues.
sonar.cpd.exclusions=packages/db/drizzle/*.sql,scripts/mutations/**

# Deliberately no `sonar.sources`.
#
# `sonar-project.properties` narrows it to `apps,packages`, which would silence
# `scripts/` — and that directory has produced two genuine findings since,
# `javascript:S4036` in #193 among them. Carrying the line forward would be
# porting a setting that was never in force and was never validated, and its
# first effect would be to stop reporting on code that has already needed
# reporting on.
#
# `scripts/mutations/` was not excluded when this file arrived, deliberately:
# those files were at 24.6% duplication in #195, an exclusion would have made the
# number go away, and that is not a reason. The question — production code, or
# declarative data for a verification instrument — was answered on its own terms
# in #194 afterwards, and the exclusion below follows from that answer rather
# than from a red gate.
#
# The experiment that came in between is why the answer can be trusted: this file
# landed carrying only the migration exemption, the four migrations went to 0%,
# and #195 stayed at 24.6% exactly. The configuration was not the cause.

# The second entry above — `scripts/mutations/**` — rests on a weaker argument
# than the migrations, and it is worth saying so rather than letting the two sit
# together as though they were the same case.
#
# Those files hold declarative specification data for a verification instrument.
# Each row states which mutation, against which named test, replacing what text
# with what. Twenty-eight rows sharing those four keys is record structure, not
# twenty-eight fragments of logic implementing the same behaviour — there is
# nothing to extract that would leave the cases intact.
#
# **The asymmetry.** A migration cannot be deduplicated: CONTRIBUTING.md forbids
# editing an applied one, so the repetition is imposed by a rule. Nothing forbids
# reshaping a mutation set. The claim is not that it is impossible — it is that
# every representation which satisfies the duplication detector costs readability
# or reviewability and buys no functional or verification gain. Measured, rather
# than asserted: grouping the mutations by the file they patch is a real
# factorisation, and it moved 26.9% to 24.6%.
#
# **What this gives up.** SonarQube Cloud stops answering whether there is
# duplication *within* the sets. That is a real loss — declarative data can be
# badly designed, and #194 already records one maintenance risk in these files,
# which is anchors rotting after a refactor.
#
# What it does not give up is everything else. The files stay inside the
# analysis for rules, security findings and bugs. This withdraws one metric;
# `sonar.exclusions` would withdraw the artefact, and is deliberately not used.
#
# The property that matters for these files is not "does not repeat structure".
# It is that every specification describes a valid mutation, and that breaking
# the guard makes a named test fail. `scripts/mutate.mjs` measures that directly
# on every run, and reports `anchor-missing`, `no-op`, `broken-build` and
# `already-red` rather than a verdict it did not obtain.
