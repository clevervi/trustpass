# The file SonarQube Cloud actually reads.
#
# `sonar-project.properties` sits beside this one and is ignored. That is not a
# guess: the vendor's documentation says "if you import a project that already
# contains a sonar-project.properties file, SonarQube Cloud will ignore the
# parameters in your sonar-project.properties file", and #197 measured it twice
# — `scripts/` is excluded there and has failed the gate from that directory
# twice.
#
# This file is read from the default branch, which is `develop`. A pull request
# therefore cannot configure its own analysis: whatever lands here applies to
# what comes next, not to the change that adds it.
#
# Wildcards are documented as unsupported here. `*.sql` below is the open
# question, and the point of landing this alone: four migrations are currently
# counted as duplicated — 0014 at 67.5%, 0016 at 37.7%, 0008 at 34.1% and 0009
# at 22.8% — so whether the pattern works is a before-and-after that can be read
# off rather than assumed.

# Forward-only migrations necessarily restate what they replace.
#
# Postgres has no ALTER FUNCTION for a body, so changing a trigger function means
# CREATE OR REPLACE with the whole thing. `CONTRIBUTING.md` forbids editing an
# applied migration, so the repetition cannot be removed without breaking a rule
# that matters more — and the scanner is measuring the migration strategy
# working.
#
# Excluded from duplication only. The files are still scanned for issues.
sonar.cpd.exclusions=packages/db/drizzle/*.sql

# Deliberately no `sonar.sources`.
#
# `sonar-project.properties` narrows it to `apps,packages`, which would silence
# `scripts/` — and that directory has produced two genuine findings since,
# `javascript:S4036` in #193 among them. Carrying the line forward would be
# porting a setting that was never in force and was never validated, and its
# first effect would be to stop reporting on code that has already needed
# reporting on.
#
# Nothing here excludes `scripts/mutations/`, either. Those files are at 24.6%
# duplication in #195 and an exclusion would make that number go away; whether
# they should be measured as production code or as declarative data for a
# verification instrument is a question worth answering on its own terms, not
# one to settle with a line added while a gate is red.
