services:
  postgres:
    image: postgres:18-alpine
    # Overridable, and `TP_PG_CONTAINER` is the name `pg-tools.ts` already uses
    # for the same thing rather than a second spelling of it.
    #
    # Fixed, this file could not be stood up twice: a second project collided on
    # the container name and on the volume below, which is how `pnpm db:setup`
    # came to be untestable without touching the developer's own database.
    container_name: ${TP_PG_CONTAINER:-trustpass-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustpass_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-trustpass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # Postgres 18 images expect the volume at /var/lib/postgresql, not at
    # /var/lib/postgresql/data: the data directory became version-scoped so that
    # pg_upgrade --link can run without crossing a mount boundary.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustpass} -d ${POSTGRES_DB:-trustpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    # Named, so `docker compose down -v` in one checkout does not silently
    # destroy another's data — and overridable for the same reason the
    # container name is.
    name: ${TP_PG_VOLUME:-trustpass_postgres_data}
