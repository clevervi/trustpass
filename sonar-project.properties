sonar.projectKey=clevervi_trustpass
sonar.organization=clevervi

sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**

# Forward-only migrations necessarily restate what they replace.
#
# Postgres has no ALTER FUNCTION for a body, so changing a trigger function
# means CREATE OR REPLACE with the whole thing — 0012 differs from 0009 by six
# lines and 0013 from 0010 by forty-six, and that is the migration strategy
# working rather than copy-paste. Editing an applied migration is forbidden by
# CONTRIBUTING.md, so the repetition cannot be removed without breaking a rule
# that matters more.
#
# Excluded from duplication analysis only. The files are still scanned for
# issues.
sonar.cpd.exclusions=packages/db/drizzle/*.sql

# Coverage is not uploaded. This project's evidence is mutation checking —
# every guard is broken on purpose and a named test has to go red — which a line
# coverage percentage does not express and can be high while missing entirely.
# A number nobody produces would be a claim nobody checked, so none is claimed.
# Tracked as #77.
sonar.coverage.exclusions=**/*
